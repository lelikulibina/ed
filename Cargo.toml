[package]
name = "ed_planet_search"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "ed_planet_search"
path = "main.rs"

[dependencies]
anyhow = "1.0.100"
clap = { version = "4.5.51", features = ["derive"] }
futures = "0.3.31"
indicatif = "0.18.2"
reqwest = { version = "0.12.24", features = ["json", "gzip", "brotli", "deflate", "cookies"] }
scraper = "0.24.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread", "sync", "time", "net", "io-util"] }
urlencoding = "2.1.3"
