[package]
name = "ed_planet_search"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.100"
clap = { version = "4.5.51", features = ["derive"] }
indicatif = "0.18.2"
reqwest = { version = "0.12.24", features = ["json", "gzip", "brotli", "deflate", "cookies"] }
scraper = "0.24.0"
serde_json = "1.0"
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread", "time"] }
urlencoding = "2.1.3"
