[package]
name = "ed_planet_search"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.100"
clap = { version = "4.5.51", features = ["derive"] }
crossterm = "0.28.1"
ratatui = "0.29.0"
reqwest = { version = "0.12.24", features = ["json", "gzip", "brotli", "deflate"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread", "sync", "time"] }

[dev-dependencies]
tokio = { version = "1.48.0", features = ["net", "io-util"] }
