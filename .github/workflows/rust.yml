name: Rust checks

on:
  push:
    branches:
      - main
      - "fix/**"
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run tests
        run: cargo test --all-targets

      - name: Smoke test EDData API
        run: |
          nearby="$(curl --fail --silent --show-error --retry 3 --retry-all-errors --retry-delay 2 --retry-max-time 30 \
            -H "User-Agent: ed-planet-search-ci/0.1.0" \
            "https://api.eddata.dev/v2/system/name/Sol/nearby?maxDistance=100")"
          printf '%s' "$nearby" | jq -e 'type == "array" and length > 0'
          bodies="$(curl --fail --silent --show-error --retry 3 --retry-all-errors --retry-delay 2 --retry-max-time 30 \
            -H "User-Agent: ed-planet-search-ci/0.1.0" \
            "https://api.eddata.dev/v2/system/name/Sol/bodies")"
          printf '%s' "$bodies" | jq -e 'type == "array" and length > 0'
          printf '%s' "$bodies" | jq '.[0] | keys'
