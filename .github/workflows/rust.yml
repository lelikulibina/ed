name: Rust checks

on:
  push:
    branches:
      - main
      - "fix/**"
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run tests
        run: cargo test --all-targets

      - name: Smoke test smaller EDSM cube and body APIs
        run: |
          system="$(curl --fail --silent --show-error --connect-timeout 5 --max-time 10 \
            -H "User-Agent: ed-planet-search-ci/0.1.0" \
            "https://www.edsm.net/api-v1/system?systemName=Sol&showCoordinates=1")"
          x="$(printf '%s' "$system" | jq -er '.coords.x')"
          y="$(printf '%s' "$system" | jq -er '.coords.y')"
          z="$(printf '%s' "$system" | jq -er '.coords.z')"
          cube="$(curl --fail --silent --show-error --connect-timeout 5 --max-time 10 --retry 3 --retry-all-errors --retry-delay 2 --retry-max-time 30 \
            -H "User-Agent: ed-planet-search-ci/0.1.0" \
            --request POST --data-urlencode "x=$x" --data-urlencode "y=$y" --data-urlencode "z=$z" --data-urlencode "size=100" --data-urlencode "showId=1" --data-urlencode "showCoordinates=1" \
            "https://www.edsm.net/api-v1/cube-systems")"
          printf '%s' "$cube" | jq -e 'type == "array" and length > 0 and .[0].coords.x'
          bodies="$(curl --fail --silent --show-error --connect-timeout 5 --max-time 10 --retry 3 --retry-all-errors --retry-delay 2 --retry-max-time 30 \
            -H "User-Agent: ed-planet-search-ci/0.1.0" \
            "https://www.edsm.net/api-system-v1/bodies?systemName=Sol")"
          printf '%s' "$bodies" | jq -e '.bodies | type == "array" and length > 0'
