name: Rust checks

on:
  push:
    branches:
      - main
      - "fix/**"
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run tests
        run: cargo test --all-targets

      - name: Smoke test smaller EDSM cube and body APIs
        run: |
          cube="$(curl --fail --silent --show-error --connect-timeout 5 --max-time 10 --retry 3 --retry-all-errors --retry-delay 2 --retry-max-time 30 \
            -H "User-Agent: ed-planet-search-ci/0.1.0" \
            "https://www.edsm.net/api-v1/cube-systems?systemName=Sol&size=100&showId=1&showCoordinates=1")"
          printf '%s' "$cube" | jq -e 'type == "array" and length > 0 and .[0].coords.x'
          bodies="$(curl --fail --silent --show-error --connect-timeout 5 --max-time 10 --retry 3 --retry-all-errors --retry-delay 2 --retry-max-time 30 \
            -H "User-Agent: ed-planet-search-ci/0.1.0" \
            "https://www.edsm.net/api-system-v1/bodies?systemName=Sol")"
          printf '%s' "$bodies" | jq -e '.bodies | type == "array" and length > 0'
