name: Rust CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt -- --check
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Tests
        run: cargo test --all-targets
      - name: Commit generated lockfile on feature branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/refactor/spansh-api-architecture'
        run: |
          if ! git diff --quiet -- Cargo.lock; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add Cargo.lock
            git commit -m "Update Cargo.lock for Spansh rewrite"
            git push origin HEAD:refactor/spansh-api-architecture
          fi
