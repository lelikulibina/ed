name: Rust CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format source snapshot for CI diagnostics
        run: cargo fmt
      - name: Upload formatted source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: formatted-rust-source
          path: src/
      - name: Format
        run: cargo fmt -- --check
      - name: Commit rustfmt output on feature branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/refactor/spansh-api-architecture'
        run: |
          if ! git diff --quiet -- src; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src
            git commit -m "Apply rustfmt to Spansh rewrite"
            git push origin HEAD:refactor/spansh-api-architecture
          fi
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Tests
        run: cargo test --all-targets
