name: Rust CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Generate and commit dependency lockfile
        run: |
          cargo fmt\n          cargo generate-lockfile
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.lock src/presentation/tui.rs
          if ! git diff --cached --quiet; then git commit -m 'build: update lockfile for Ratatui TUI'; git push origin HEAD:${GITHUB_REF_NAME}; fi
      - name: Format
        run: cargo fmt -- --check
      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Tests
        run: cargo test --locked --all-targets
