name: TTY Interface Diagnostics

on:
  workflow_dispatch:
  push:
    branches:
      - ed-ps-new-horizon
    paths:
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/tty-diagnostics.yml'

permissions:
  contents: read

jobs:
  tty-diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Build application
        run: cargo build --locked
      - name: Save test inventory
        run: cargo test --locked -- --list 2>&1 | tee tty-test-inventory.txt
      - name: Capture TTY at 120x40
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tty-artifacts
          { sleep 2; printf '\\033'; } | TERM=xterm-256color timeout 20s script -q -e -c 'stty cols 120 rows 40; test -t 0 && test -t 1; exec ./target/debug/ed_planet_search' tty-artifacts/tty-120x40.log
      - name: Capture TTY at minimum supported 80x24
        shell: bash
        run: |
          set -euo pipefail
          { sleep 2; printf '\\033'; } | TERM=xterm-256color timeout 20s script -q -e -c 'stty cols 80 rows 24; test -t 0 && test -t 1; exec ./target/debug/ed_planet_search' tty-artifacts/tty-80x24.log
      - name: Capture small terminal behavior 60x18
        shell: bash
        run: |
          set -euo pipefail
          { sleep 2; printf '\\033'; } | TERM=xterm-256color timeout 20s script -q -e -c 'stty cols 60 rows 18; test -t 0 && test -t 1; exec ./target/debug/ed_planet_search' tty-artifacts/tty-60x18.log
      - name: Publish diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tty-diagnostics-${{ github.run_number }}
          path: |
            tty-artifacts/
            tty-test-inventory.txt
          if-no-files-found: warn