name: TTY Interface Diagnostics

on:
  workflow_dispatch:
  push:
    branches:
      - ed-ps-new-horizon
    paths:
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/tty-diagnostics.yml'

permissions:
  contents: read

jobs:
  tty-diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Build release application
        run: cargo build --release
      - name: Save test inventory
        run: cargo test -- --list 2>&1 | tee tty-test-inventory.txt
      - name: Capture TTY at 120x40
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tty-artifacts
          { sleep 2; printf '\033'; } | TERM=xterm-256color timeout 20s script -q -e -c 'stty cols 120 rows 40; test -t 0 && test -t 1; exec ./target/release/ed_planet_search' tty-artifacts/tty-120x40.log
      - name: Capture TTY at minimum supported 80x24
        shell: bash
        run: |
          set -euo pipefail
          { sleep 2; printf '\033'; } | TERM=xterm-256color timeout 20s script -q -e -c 'stty cols 80 rows 24; test -t 0 && test -t 1; exec ./target/release/ed_planet_search' tty-artifacts/tty-80x24.log
      - name: Capture small terminal behavior 60x18
        shell: bash
        run: |
          set -euo pipefail
          { sleep 2; printf '\033'; } | TERM=xterm-256color timeout 20s script -q -e -c 'stty cols 60 rows 18; test -t 0 && test -t 1; exec ./target/release/ed_planet_search' tty-artifacts/tty-60x18.log
      - name: Verify Ctrl+Q restores terminal state at 80x24
        shell: bash
        run: |
          set -euo pipefail
          { sleep 2; printf '\021'; } | TERM=xterm-256color timeout 20s script -q -e -c 'stty cols 80 rows 24; before=$(stty -g); ./target/release/ed_planet_search; after=$(stty -g); test "$before" = "$after"' tty-artifacts/tty-ctrl-q-80x24.log
      - name: Verify NO_COLOR at minimum supported 80x24
        shell: bash
        run: |
          set -euo pipefail
          { sleep 2; printf '\033'; } | NO_COLOR=1 TERM=xterm-256color timeout 20s script -q -e -c 'stty cols 80 rows 24; test -t 0 && test -t 1; exec ./target/release/ed_planet_search' tty-artifacts/tty-no-color-80x24.log
          if perl -ne 'while (/\e\[([0-9;]*)m/g) { for $code (split /;/, $1) { exit 1 if $code =~ /^(?:3[0-7]|38|39|4[0-7]|48|49|9[0-7]|10[0-7])$/ } }' tty-artifacts/tty-no-color-80x24.log; then
            echo "NO_COLOR output contains no foreground/background color SGR codes"
          else
            echo "NO_COLOR output unexpectedly contains foreground/background color SGR codes" >&2
            exit 1
          fi
      - name: Publish diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tty-diagnostics-${{ github.run_number }}
          path: |
            tty-artifacts/
            tty-test-inventory.txt
          if-no-files-found: warn