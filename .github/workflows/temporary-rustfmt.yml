name: Temporary Rust formatting pass

on:
  push:
    branches: ["refactor/spansh-api-architecture"]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/spansh-api-architecture
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format Rust sources and commit result
        run: |
          cargo fmt
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src
            git commit -m "style: apply rustfmt to search menu"
            git push origin HEAD:refactor/spansh-api-architecture
          fi
